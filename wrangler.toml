name = "oscar-poultry-site"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# Local-dev-only binding so `wrangler pages dev` / `wrangler d1 execute --local`
# can simulate D1 on this machine. Production still needs the same binding
# (variable name "DB") added manually in the Cloudflare Pages dashboard under
# Settings > Functions > D1 database bindings — this file does not configure
# production for a git-connected Pages project.
[[d1_databases]]
binding = "DB"
database_name = "oscar-poultry-db"
database_id = "a9b86a8e-cdaa-40d6-a936-b127927f50be"
