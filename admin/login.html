<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | لوحة التحكم</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#214f39">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/png" href="../photos/oscar-logo.png">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="الصفحة الرئيسية">
        <img class="brand-logo" src="../photos/oscar-logo.png" alt="شعار Oscar Poultry Supplies">
        <span class="brand-copy brand-copy--wordmark">
          <strong>Oscar Poultry</strong>
          <small>لوحة التحكم</small>
        </span>
      </a>
    </header>

    <main>
      <section class="section admin-login-section">
        <div class="admin-login-card">
          <p class="eyebrow">لوحة التحكم</p>
          <h1>تسجيل الدخول</h1>
          <p>الصفحة دي خاصة بصاحب الموقع فقط.</p>

          <form class="contact-form" id="admin-login-form">
            <label>
              كلمة المرور
              <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button class="button button-primary" type="submit">دخول</button>
            <p class="form-error" id="admin-login-error" hidden>كلمة المرور غير صحيحة، حاول تاني.</p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="login.js"></script>
</body>
</html>
